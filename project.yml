# XcodeGen spec. Single source of truth for the Xcode project, Info.plist, and
# entitlements. Run `make gen` (or `xcodegen generate`) after editing.
name: pdviewer
options:
  bundleIdPrefix: com.contractorkeith
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true

targets:
  pdviewer:
    type: application
    platform: macOS
    sources:
      - path: pdviewer
    info:
      path: pdviewer/Resources/Info.plist
      properties:
        CFBundleName: pdviewer
        CFBundleDisplayName: pdviewer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Keith Bloemendaal. MIT License."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    entitlements:
      path: pdviewer/Resources/pdviewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contractorkeith.pdviewer
        PRODUCT_NAME: pdviewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc signing for local dev. Release signing is done by the DMG script.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: true
        COMBINE_HIDPI_IMAGES: true

  pdviewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: pdviewerTests
    dependencies:
      - target: pdviewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contractorkeith.pdviewerTests
        GENERATE_INFOPLIST_FILE: true

  pdviewerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: pdviewerUITests
      - path: pdviewerTests/TextPDFFixture.swift
    dependencies:
      - target: pdviewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contractorkeith.pdviewerUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: pdviewer

schemes:
  pdviewer:
    build:
      targets:
        pdviewer: all
        pdviewerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - pdviewerTests
  # UI smoke test is its own scheme: it launches the app and is slower.
  pdviewerUITests:
    build:
      targets:
        pdviewer: all
        pdviewerUITests: [test]
    test:
      config: Debug
      targets:
        - pdviewerUITests
